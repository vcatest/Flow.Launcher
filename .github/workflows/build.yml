name: .NET
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # CHANGED: Must be Windows for WPF
    # Removed 'container' line because it is for Linux containers
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # Flow.Launcher often uses submodules, good practice to include

    # Java is required for SonarScanner. using setup-java is cleaner than manual install
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install SonarScanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        
    - name: SonarScanner Begin
      shell: powershell
      run: |
        dotnet sonarscanner begin /k:"vcatest_Flow.Launcher" /o:"vcatest" /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e" /d:sonar.host.url="https://sonarcloud.io/"

    - name: Build Project
      # Removed EnableWindowsTargeting (not needed on actual Windows)
      run: dotnet build

    - name: SonarScanner End
      shell: powershell
      run: dotnet sonarscanner end /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e"
